<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Star Glow Gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Core Star Gradient -->
    <linearGradient id="starCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Constellation -->
  <circle cx="256" cy="256" r="210" fill="url(#starGlow)" />

  <!-- Constellation Connecting Lines -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="4 3">
    <line x1="256" y1="256" x2="140" y2="170" />
    <line x1="256" y1="256" x2="380" y2="160" />
    <line x1="256" y1="256" x2="350" y2="360" />
    <line x1="256" y1="256" x2="150" y2="350" />
    <line x1="140" y1="170" x2="380" y2="160" stroke-opacity="0.2" />
  </g>

  <!-- Outer Constellation Star Nodes -->
  <circle cx="140" cy="170" r="12" fill="url(#nodeGrad)" filter="url(#glowFilter)" />
  <circle cx="140" cy="170" r="6" fill="#ffffff" />

  <circle cx="380" cy="160" r="14" fill="url(#nodeGrad)" filter="url(#glowFilter)" />
  <circle cx="380" cy="160" r="7" fill="#ffffff" />

  <circle cx="350" cy="360" r="11" fill="url(#nodeGrad)" filter="url(#glowFilter)" />
  <circle cx="350" cy="360" r="5" fill="#ffffff" />

  <circle cx="150" cy="350" r="10" fill="url(#nodeGrad)" filter="url(#glowFilter)" />
  <circle cx="150" cy="350" r="5" fill="#ffffff" />

  <!-- Central Supernova Four-Point Star -->
  <g filter="url(#glowFilter)">
    <path
      d="M 256 96 
         Q 256 256 416 256 
         Q 256 256 256 416 
         Q 256 256 96 256 
         Q 256 256 256 96 Z"
      fill="url(#starCore)"
    />
  </g>

  <!-- Central Star Center Flare -->
  <circle cx="256" cy="256" r="18" fill="#ffffff" />
</svg>
