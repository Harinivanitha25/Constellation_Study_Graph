<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Constellation</title>
    <script type="text/javascript">
      // Segment-routing hack for GitHub Pages Single Page Apps
      var pathSegmentsToKeep = 1; // Change to 0 if deploying to a custom root domain
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
        l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
