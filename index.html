    <script>
      (function() {
        var isResizeObserverErr = function(err) {
          var str = String((err && (err.message || err)) || '');
          return str.indexOf('ResizeObserver loop') !== -1;
        };
        window.addEventListener('error', function(e) {
          if (isResizeObserverErr(e.message) || isResizeObserverErr(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isResizeObserverErr(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
